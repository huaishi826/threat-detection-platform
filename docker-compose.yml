services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: threatsight-backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./config.json:/app/config.json
      - ./samples:/app/samples
      - ./results:/app/results
      - ./captures:/app/captures
      - threatsight_db:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: threatsight-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  threatsight_db:
